name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.1
  RUST_VERSION: 1.98.0
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_COMPILE_SDK: 37

jobs:
  build-apk:
    name: Build Android APK
    runs-on: windows-latest
    outputs:
      version_full: ${{ steps.version.outputs.full }}
      version_tag: ${{ steps.version.outputs.tag }}
      version_replaced: ${{ steps.version.outputs.replaced }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw 'ANDROID_HOME/ANDROID_SDK_ROOT 未设置' }
          $sdkmanager = @(
            (Join-Path $sdk 'cmdline-tools\16.0\bin\sdkmanager.bat'),
            (Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat')
          ) + @(
            Get-ChildItem (Join-Path $sdk 'cmdline-tools\*\bin\sdkmanager.bat') -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | ForEach-Object { $_.FullName }
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sdkmanager) { throw "找不到 sdkmanager，SDK=$sdk" }
          Write-Host "Using sdkmanager: $sdkmanager"

          $yesFile = Join-Path $env:RUNNER_TEMP 'sdk-yes.txt'
          1..200 | ForEach-Object { 'y' } | Set-Content -Path $yesFile -Encoding ascii
          $outFile = Join-Path $env:RUNNER_TEMP 'sdk-out.txt'
          $errFile = Join-Path $env:RUNNER_TEMP 'sdk-err.txt'

          function Invoke-SdkManager([string]$ArgsLine) {
            $sdkRoot = "--sdk_root=$sdk"
            $cmdLine = "`"$sdkmanager`" $sdkRoot $ArgsLine > `"$outFile`" 2> `"$errFile`" < `"$yesFile`""
            Write-Host "CMD: $cmdLine"
            cmd.exe /D /S /C $cmdLine | Out-Null
            $code = $LASTEXITCODE
            if (Test-Path $outFile) {
              $txt = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
              if ($txt) { Write-Host $txt }
            }
            if (Test-Path $errFile) {
              $etxt = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
              if ($etxt) { Write-Host $etxt }
            }
            return $code
          }

          $null = Invoke-SdkManager '--licenses'

          function Install-Package([string]$Package, [bool]$Required = $true) {
            $channels = @('', '--channel=0', '--channel=1', '--channel=2', '--channel=3')
            foreach ($ch in $channels) {
              $code = Invoke-SdkManager (($ch + ' ' + "`"$Package`"").Trim())
              if ($code -eq 0) {
                Write-Host "OK: $Package"
                return $true
              }
            }
            Write-Host "$(if($Required){'##[error]'}else{'##[warning]'})安装失败：$Package"
            return $false
          }

          # 打包 APK 不依赖 adb，platform-tools 失败可忽略。
          $null = Install-Package 'platform-tools' -Required $false

          $compileSdk = $env:ANDROID_COMPILE_SDK
          $platformCandidates = @(
            "platforms;android-$compileSdk",
            "platforms;android-$compileSdk.0",
            "platforms;android-$compileSdk.1",
            "platforms;android-$compileSdk.2",
            "platforms;android-$compileSdk.2-beta3",
            "platforms;android-$compileSdk.2-beta2",
            "platforms;android-$compileSdk.2-beta1"
          )
          $okPlatform = $false
          foreach ($pkg in $platformCandidates) {
            if (Install-Package $pkg) {
              $okPlatform = $true
              Write-Host "使用平台包：$pkg"
              break
            }
          }
          if (-not $okPlatform) {
            Write-Host '列出现有 platforms 以便回退…'
            $null = Invoke-SdkManager '--list'
            $listText = ''
            if (Test-Path $outFile) { $listText = Get-Content $outFile -Raw }
            if (Test-Path $errFile) { $listText += Get-Content $errFile -Raw }
            $versions = [regex]::Matches($listText, 'platforms;android-(\d+(?:\.\d+)?)') |
              ForEach-Object { $_.Groups[1].Value } |
              Sort-Object -Unique -Descending
            Write-Host ("remote platforms: " + (($versions | ForEach-Object { "android-$_" }) -join ', '))
            $ok = $false
            foreach ($v in $versions) {
              $major = [int](($v -split '\.')[0])
              if ($major -gt [int]$compileSdk) { continue }
              if (Install-Package "platforms;android-$v") {
                "ANDROID_COMPILE_SDK=$major" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                Write-Host "回退 compileSdk: $compileSdk -> $major (package android-$v)"
                $compileSdk = "$major"
                $ok = $true
                break
              }
            }
            if (-not $ok) { throw "platforms 安装失败（目标 API $env:ANDROID_COMPILE_SDK）" }
          }

          $buildTools = $env:ANDROID_BUILD_TOOLS
          if (-not (Install-Package "build-tools;$buildTools")) {
            $null = Invoke-SdkManager '--list'
            $listText = ''
            if (Test-Path $outFile) { $listText = Get-Content $outFile -Raw }
            $btVers = [regex]::Matches($listText, 'build-tools;(\d+\.\d+\.\d+)') |
              ForEach-Object { $_.Groups[1].Value } |
              Sort-Object -Unique -Descending
            Write-Host ("remote build-tools: " + ($btVers -join ', '))
            $ok = $false
            foreach ($bt in $btVers) {
              if (Install-Package "build-tools;$bt") {
                "ANDROID_BUILD_TOOLS=$bt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                $env:ANDROID_BUILD_TOOLS = $bt
                $buildTools = $bt
                $ok = $true
                break
              }
            }
            if (-not $ok) { throw "build-tools 安装失败（目标 $env:ANDROID_BUILD_TOOLS）" }
          }

          $ndkVersion = $env:ANDROID_NDK_VERSION
          if (-not (Install-Package "ndk;$ndkVersion")) {
            $null = Invoke-SdkManager '--list'
            $listText = ''
            if (Test-Path $outFile) { $listText = Get-Content $outFile -Raw }
            $ndkVers = [regex]::Matches($listText, 'ndk;(\d+\.\d+\.\d+)') |
              ForEach-Object { $_.Groups[1].Value } |
              Sort-Object -Unique -Descending
            Write-Host ("remote ndk: " + (($ndkVers | Select-Object -First 8) -join ', '))
            $ok = $false
            foreach ($ndk in ($ndkVers | Where-Object { $_ -like '28.*' }) + $ndkVers) {
              if (Install-Package "ndk;$ndk") {
                "ANDROID_NDK_VERSION=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                $env:ANDROID_NDK_VERSION = $ndk
                $ndkVersion = $ndk
                $ok = $true
                break
              }
            }
            if (-not $ok) { throw "NDK 安装失败（目标 $env:ANDROID_NDK_VERSION）" }
          }

          $platformDir = Get-ChildItem (Join-Path $sdk 'platforms\android-*') -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "^android-$compileSdk(\.|$)" } |
            Select-Object -First 1
          $ndkDir = Join-Path $sdk "ndk\$ndkVersion"
          if (-not $platformDir) { throw "平台目录不存在：platforms\android-$compileSdk*" }
          if (!(Test-Path $ndkDir)) { throw "NDK 目录不存在：$ndkDir" }
          $zipalign = Join-Path $sdk "build-tools\$buildTools\zipalign.exe"
          if (!(Test-Path $zipalign)) { throw "缺少 zipalign：$zipalign" }

          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SDK ready: compileSdk=$compileSdk ndk=$ndkVersion build-tools=$buildTools"

      - name: Sync version from single source
        id: version
        shell: pwsh
        run: |
          $sourceBase = (Get-Content .\VERSION -Raw).Trim()
          $tag = $null
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
            Write-Host "触发方式：tag $tag"
          } else {
            Write-Host '触发方式：push main（语义版本取 VERSION，versionCode=git 提交次数）'
          }
          if ($tag -and $tag -notmatch '^v(\d+\.\d+\.\d+)(?:\+(\d+))?$') {
            throw "tag 不符合版本规范 vX.Y.Z[+build]：$tag"
          }
          $syncArgs = @{}
          if ($tag) { $syncArgs.OverrideTag = $tag }
          try {
            & .\mobile\tool\sync-version.ps1 @syncArgs
          } catch {
            throw "版本同步失败：$($_.Exception.Message)"
          }
          $full = ((Get-Content .\mobile\pubspec.yaml | Where-Object { $_ -match '^version:\s*(.+)$' } | Select-Object -First 1) -replace '^version:\s*','').Trim()
          if (-not $full) { throw '无法从 pubspec 读取版本' }
          if ($full -notmatch '^\d+\.\d+\.\d+\+\d+$') { throw "pubspec 版本格式异常：$full" }
          Write-Host "pubspec version = $full"
          $replaced = ''
          if ($tag) {
            $tagBase = ($tag -replace '^v','' -replace '\+.*$','')
            if ($sourceBase -ne $tagBase) {
              $replaced = "$sourceBase -> $tagBase"
              Write-Host "::notice title=版本已替换::源码 VERSION($sourceBase) 与 tag($tagBase) 不一致，构建时已替换为 tag 版本"
            } else {
              Write-Host '源码版本与 tag 一致，无需替换'
            }
          }
          "full=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "replaced=$replaced" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_base=$sourceBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Decide build mode
        id: mode
        shell: pwsh
        run: |
          $hasSigning = -not [string]::IsNullOrWhiteSpace('${{ secrets.STEREORANGE_KEYSTORE_BASE64 }}')
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          if ($isTag -and -not $hasSigning) {
            throw 'tag 发布构建需要签名密钥。请配置 Secrets：STEREORANGE_KEYSTORE_BASE64、STEREORANGE_STORE_PASSWORD、STEREORANGE_KEY_ALIAS、STEREORANGE_KEY_PASSWORD'
          }
          if ($hasSigning) {
            "mode=release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "public=True" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "mode=debug" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "public=False" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host '::notice title=未配置签名::当前将构建 debug APK（可在 Actions 产物中下载）'
          }

      - name: Prepare signing
        if: steps.mode.outputs.mode == 'release'
        shell: pwsh
        env:
          STEREORANGE_KEYSTORE_BASE64: ${{ secrets.STEREORANGE_KEYSTORE_BASE64 }}
          STEREORANGE_STORE_PASSWORD: ${{ secrets.STEREORANGE_STORE_PASSWORD }}
          STEREORANGE_KEY_ALIAS: ${{ secrets.STEREORANGE_KEY_ALIAS }}
          STEREORANGE_KEY_PASSWORD: ${{ secrets.STEREORANGE_KEY_PASSWORD }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'stereorange-signing'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $p12 = Join-Path $dir 'release.p12'
          [IO.File]::WriteAllBytes($p12, [Convert]::FromBase64String($env:STEREORANGE_KEYSTORE_BASE64))
          "STEREORANGE_KEYSTORE=$p12" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STEREORANGE_STORE_PASSWORD=$env:STEREORANGE_STORE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STEREORANGE_KEY_ALIAS=$env:STEREORANGE_KEY_ALIAS" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STEREORANGE_KEY_PASSWORD=$env:STEREORANGE_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build APK
        shell: pwsh
        env:
          STEREORANGE_KEYSTORE: ${{ env.STEREORANGE_KEYSTORE }}
          STEREORANGE_STORE_PASSWORD: ${{ env.STEREORANGE_STORE_PASSWORD }}
          STEREORANGE_KEY_ALIAS: ${{ env.STEREORANGE_KEY_ALIAS }}
          STEREORANGE_KEY_PASSWORD: ${{ env.STEREORANGE_KEY_PASSWORD }}
        run: |
          $mode = '${{ steps.mode.outputs.mode }}'
          $public = '${{ steps.mode.outputs.public }}' -eq 'True'
          $versionTag = $null
          if ('${{ github.ref_type }}' -eq 'tag') { $versionTag = '${{ github.ref_name }}' }
          $buildArgs = @{
            Mode = $mode
            AndroidSdk = $env:ANDROID_HOME
          }
          if ($public) { $buildArgs.PublicRelease = $true }
          if ($versionTag) { $buildArgs.VersionTag = $versionTag }
          Write-Host "构建参数：$($buildArgs | ConvertTo-Json -Compress)"
          & .\mobile\tool\build.ps1 @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'APK 构建失败' }

      - name: Package artifacts
        id: pack
        shell: pwsh
        run: |
          $mode = '${{ steps.mode.outputs.mode }}'
          $full = '${{ steps.version.outputs.full }}'.Trim()
          if (-not $full) { throw '缺少版本号输出' }
          $src = "mobile/build/app/outputs/flutter-apk/app-$mode.apk"
          if (!(Test-Path $src)) { throw "找不到 APK：$src" }
          $artifactName = "StereoRange-v$full-android-arm64"
          $outDir = 'mobile/artifacts/ci'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $apkName = "$artifactName.apk"
          Copy-Item -LiteralPath $src -Destination (Join-Path $outDir $apkName) -Force
          $hash = (Get-FileHash -LiteralPath (Join-Path $outDir $apkName) -Algorithm SHA256).Hash.ToLower()
          @(
            "$hash  $apkName"
          ) | Set-Content -LiteralPath (Join-Path $outDir 'SHA256SUMS.txt') -Encoding ascii
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "apk_path=$outDir/$apkName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "打包完成：$apkName"
          Write-Host "SHA-256：$hash"
          "## APK 构建结果" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- 版本：``v$full``" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- 模式：``$mode``" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- 文件：``$apkName``" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- SHA-256：``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: |
            mobile/artifacts/ci/*.apk
            mobile/artifacts/ci/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $apk = '${{ steps.pack.outputs.apk_path }}'
          $sums = 'mobile/artifacts/ci/SHA256SUMS.txt'
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} --title "StereoRange $tag" --notes "CI 构建产物：$tag" --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败：$tag" }
          }
          gh release upload $tag --repo ${{ github.repository }} --clobber $apk $sums
          if ($LASTEXITCODE -ne 0) { throw '上传 Release 附件失败' }
          Write-Host "已将 APK 挂到 Release $tag"
